name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/decision-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.22.x"}
      - run: gofmt -w $(find . -name '*.go')
      - run: test -z "$(git diff -- .)"
      - run: go test ./...
  typescript:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/case-workflow}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: services/case-workflow/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/lakehouse}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: PYTHONPATH=src pytest -q
  rust:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/analytics-query}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --locked
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required contracts and safety vocabulary
        run: |
          test -f contracts/json-schema/claim-event.schema.json
          test -f contracts/json-schema/decision-record.schema.json
          test -f contracts/json-schema/case-task.schema.json
          test -f contracts/json-schema/ledger-posting-intent.schema.json
          ! grep -R '"action".*"DENY"' contracts/json-schema
          ! grep -R '"action".*"SUSPEND"' contracts/json-schema
