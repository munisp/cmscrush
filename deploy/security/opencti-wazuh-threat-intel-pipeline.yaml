apiVersion: v1
kind: Namespace
metadata:
  name: security-analytics
  labels:
    crush.io/plane: security-observability
    crush.io/data-class: security-telemetry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-alert-forwarder
  namespace: security-analytics
  labels: {app.kubernetes.io/part-of: crush}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-alert-forwarder
  namespace: security-analytics
  labels:
    app.kubernetes.io/name: wazuh-alert-forwarder
    app.kubernetes.io/part-of: crush
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: wazuh-alert-forwarder}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-alert-forwarder
        app.kubernetes.io/part-of: crush
        crush.io/data-class: security-telemetry
        crush.io/access-healthcare-data: "false"
    spec:
      serviceAccountName: wazuh-alert-forwarder
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: forwarder
          image: ghcr.io/munisp/cmscrush/wazuh-alert-forwarder:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: WAZUH_EXPORT_URL, valueFrom: {secretKeyRef: {name: wazuh-alert-forwarder, key: export-url}}}
            - {name: WAZUH_EXPORT_TOKEN, valueFrom: {secretKeyRef: {name: wazuh-alert-forwarder, key: export-token}}}
            - {name: KAFKA_TOPIC, value: security.wazuh.alert.v1}
            - {name: REDACTION_POLICY_VERSION, value: security-redaction-v1}
            - {name: PHI_LOGGING, value: disabled}
            - {name: DROP_FIELDS, value: "patient_name,beneficiary_id,claim_id,clinical_note,request_body,query_string,full_path"}
          ports: [{name: metrics, containerPort: 9090}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}}
          livenessProbe: {httpGet: {path: /healthz, port: metrics}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencti-sightings-connector
  namespace: security-analytics
  labels:
    app.kubernetes.io/name: opencti-sightings-connector
    app.kubernetes.io/part-of: crush
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: opencti-sightings-connector}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencti-sightings-connector
        app.kubernetes.io/part-of: crush
        crush.io/data-class: sanitized-cti
        crush.io/access-healthcare-data: "false"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: connector
          image: ghcr.io/munisp/cmscrush/opencti-sightings-connector:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: OPENCTI_URL, valueFrom: {secretKeyRef: {name: opencti-sightings-connector, key: url}}}
            - {name: OPENCTI_TOKEN, valueFrom: {secretKeyRef: {name: opencti-sightings-connector, key: token}}}
            - {name: CONNECTOR_TYPE, value: STREAM}
            - {name: CONNECTOR_SCOPE, value: sighting,indicator,observable}
            - {name: KAFKA_TOPIC, value: security.sighting.v1}
            - {name: ALLOW_RAW_PHI, value: "false"}
            - {name: ALLOW_RAW_AUDIT_PAYLOAD, value: "false"}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-analytics-restricted-egress
  namespace: security-analytics
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: security-observability}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: security-observability}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: threat-intelligence}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kafka}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
  # No rule permits claims, clinical, beneficiary, enrollment, or financial namespaces.
