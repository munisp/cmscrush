apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ printf "crush-%s-%s" .Values.global.tenantId .Values.global.environment | quote }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-decision-service-dependencies
  namespace: {{ printf "crush-%s-%s" .Values.global.tenantId .Values.global.environment | quote }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: decision-service}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: apisix}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kafka}
      ports: [{protocol: TCP, port: 9092}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: redis}
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: temporal}
      ports: [{protocol: TCP, port: 7233}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-analytics-read-only
  namespace: {{ printf "crush-%s-%s" .Values.global.tenantId .Values.global.environment | quote }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: analytics-query}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: apisix}
      ports: [{protocol: TCP, port: 8090}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
