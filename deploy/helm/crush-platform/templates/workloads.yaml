apiVersion: v1
kind: Namespace
metadata:
  name: {{ printf "crush-%s-%s" .Values.global.tenantId .Values.global.environment | quote }}
  labels:
    crush.platform/tenant: {{ .Values.global.tenantId | quote }}
    crush.platform/environment: {{ .Values.global.environment | quote }}
    pod-security.kubernetes.io/enforce: restricted
    kubecost.com/tenant: {{ .Values.global.tenantId | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: decision-service
  namespace: {{ printf "crush-%s-%s" .Values.global.tenantId .Values.global.environment | quote }}
  labels:
    app.kubernetes.io/name: decision-service
    crush.platform/tenant: {{ .Values.global.tenantId | quote }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-service
  namespace: {{ printf "crush-%s-%s" .Values.global.tenantId .Values.global.environment | quote }}
  labels:
    app.kubernetes.io/name: decision-service
    crush.platform/tenant: {{ .Values.global.tenantId | quote }}
    crush.platform/data-classification: {{ .Values.global.dataClassification | quote }}
    kubecost.com/tenant: {{ .Values.global.tenantId | quote }}
    kubecost.com/cost-center: {{ .Values.global.costCenter | quote }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: decision-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decision-service
        crush.platform/tenant: {{ .Values.global.tenantId | quote }}
        crush.platform/data-classification: {{ .Values.global.dataClassification | quote }}
        kubecost.com/tenant: {{ .Values.global.tenantId | quote }}
        kubecost.com/cost-center: {{ .Values.global.costCenter | quote }}
      annotations:
        dapr.io/enabled: {{ .Values.global.daprEnabled | quote }}
        dapr.io/app-id: decision-service
        dapr.io/app-port: {{ .Values.service.decisionServicePort | quote }}
        dapr.io/config: crush-resiliency
    spec:
      serviceAccountName: decision-service
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: decision-service
          image: {{ .Values.images.decisionService | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.service.decisionServicePort }}}]
          env:
            - {name: PORT, value: {{ .Values.service.decisionServicePort | quote }}}
            - {name: KAFKA_BROKERS, value: {{ .Values.external.kafka.brokers | quote }}}
            - {name: KEYCLOAK_ISSUER, value: {{ .Values.global.keycloakIssuer | quote }}}
          resources: {{- toYaml .Values.resources.decisionService | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: decision-service
  namespace: {{ printf "crush-%s-%s" .Values.global.tenantId .Values.global.environment | quote }}
spec:
  selector: {app.kubernetes.io/name: decision-service}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-query
  namespace: {{ printf "crush-%s-%s" .Values.global.tenantId .Values.global.environment | quote }}
  labels:
    app.kubernetes.io/name: analytics-query
    crush.platform/tenant: {{ .Values.global.tenantId | quote }}
    kubecost.com/tenant: {{ .Values.global.tenantId | quote }}
    kubecost.com/cost-center: {{ .Values.global.costCenter | quote }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: analytics-query}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-query
        crush.platform/tenant: {{ .Values.global.tenantId | quote }}
        kubecost.com/tenant: {{ .Values.global.tenantId | quote }}
        kubecost.com/cost-center: {{ .Values.global.costCenter | quote }}
      annotations:
        dapr.io/enabled: {{ .Values.global.daprEnabled | quote }}
        dapr.io/app-id: analytics-query
        dapr.io/app-port: {{ .Values.service.analyticsQueryPort | quote }}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: analytics-query
          image: {{ .Values.images.analyticsQuery | quote }}
          ports: [{name: http, containerPort: {{ .Values.service.analyticsQueryPort }}}]
          env: [{name: LAKEHOUSE_ROOT, value: /lakehouse}]
          resources: {{- toYaml .Values.resources.analyticsQuery | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3}
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-query
  namespace: {{ printf "crush-%s-%s" .Values.global.tenantId .Values.global.environment | quote }}
spec:
  selector: {app.kubernetes.io/name: analytics-query}
  ports: [{name: http, port: 8090, targetPort: http}]
